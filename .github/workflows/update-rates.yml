name: Update rates

on:
  schedule:
    # 3× per day: morning, noon, evening (Algiers = UTC+1)
    - cron: '30 6,11,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest rates
        run: node scripts/fetch-rates.mjs
      - name: Commit if changed
        run: |
          git config user.name "sarf-bot"
          git config user.email "actions@github.com"
          git add data/rates.json
          git diff --cached --quiet || git commit -m "rates: $(date -u +%F)"
          git push
